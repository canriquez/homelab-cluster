apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.6.x" # We pinnit to a minor version to avoid breaking changes

      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule

  values:
    # k3s runs controller-manager, scheduler and kube-proxy inside the k3s
    # process; their metrics endpoints are not scrapable, so the default
    # *Down alerts fire forever (critical). Disabling the scrape also drops
    # those alerts (RAY-131).
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Alert routing (RAY-130 dead-man's switch + RAY-131 severity routing):
    # - Watchdog (always firing) pings Healthchecks.io; silence = alarm.
    # - Paging (ntfy push, urgent): alerts labelled page="true" (our rules in
    #   monitoring/configs/staging/rayces-alert-rules.yaml) and any critical
    #   alert from the production namespaces.
    # - E-mail via Brevo SMTP: every critical and warning alert (daily repeat).
    # - info / InfoInhibitor: nowhere.
    # Secrets (SOPS, monitoring/configs/staging/kube-prometheus-stack/), mounted
    # at /etc/alertmanager/secrets/<name>/<key>:
    #   alertmanager-deadman/url  Healthchecks.io ping URL
    #   alertmanager-ntfy/url     ntfy topic URL (?template=alertmanager&priority=urgent)
    #   grafana-smtp-credentials/SMTP_PASSWORD  Brevo SMTP key (shared with Grafana)
    #   alertmanager-email/recipients.tmpl  defines "rayces.warning_to" (warning
    #     recipient address, kept out of git plaintext; used by the email receiver)
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-deadman
          - alertmanager-ntfy
          - grafana-smtp-credentials
          - alertmanager-email
      config:
        global:
          smtp_smarthost: smtp-relay.brevo.com:587
          smtp_from: ExperientiaLabs Alerts <bot@experientialabs.net>
          smtp_auth_username: a59261001@smtp-brevo.com
          smtp_auth_password_file: /etc/alertmanager/secrets/grafana-smtp-credentials/SMTP_PASSWORD
          smtp_require_tls: true
        templates:
          - /etc/alertmanager/config/*.tmpl
          - /etc/alertmanager/secrets/alertmanager-email/*.tmpl
        route:
          receiver: "null"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: deadman
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            - matchers:
                - alertname = "InfoInhibitor"
              receiver: "null"
            - matchers:
                - page = "true"
              receiver: ntfy-critical
              repeat_interval: 4h
              continue: true
            - matchers:
                - severity = "critical"
                - namespace =~ "rayces-production|rayces-db-prod"
                - page != "true"
              receiver: ntfy-critical
              repeat_interval: 4h
              continue: true
            - matchers:
                - severity =~ "critical|warning"
              receiver: email
        receivers:
          - name: "null"
          - name: deadman
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-deadman/url
                send_resolved: false
          - name: ntfy-critical
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
                send_resolved: true
          - name: email
            email_configs:
              - to: '{{ template "rayces.warning_to" . }}'
                send_resolved: true

    grafana:
      # Admin credentials come from the dedicated SOPS-encrypted secret
      # grafana-admin-credentials. This MUST use admin.existingSecret: the chart
      # sets GF_SECURITY_ADMIN_USER/PASSWORD as explicit env: (valueFrom), which
      # override envFrom — so envFromSecret cannot set the admin password.
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password

      # SMTP user/password come from grafana-smtp-credentials, injected as env
      # vars (envFrom) and read by grafana.ini via $__env{...} below.
      envFromSecret: grafana-smtp-credentials

      grafana.ini:
        smtp:
          enabled: true
          host: smtp-relay.brevo.com:587
          user: $__env{SMTP_USER}
          from_address: bot@experientialabs.net
          from_name: ElBot Grafana Monitoring
          startTLS_policy: MandatoryStartTLS
          password: $__env{SMTP_PASSWORD}

      ingress:
        enabled: true
        ingressClassName: traefik

        ## Override ingress to a different defined port on the service
        # servicePort: 8081
        ## Override ingress to a different service then the default, this is useful if you need to
        ## point to a specific instance of the alertmanager (eg kube-prometheus-stack-alertmanager-0)
        # serviceName: kube-prometheus-stack-alertmanager-0

        ## Hosts must be provided if Ingress is enabled.
        ##
        hosts:
          - grs.experientialabs.net

        ## For Kubernetes >= 1.18 you should specify the pathType (determines how Ingress paths should be matched)
        ## See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
        # pathType: ImplementationSpecific

        ## TLS configuration for Alertmanager Ingress
        ## Secret must be manually created in the namespace
        ##
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grs.experientialabs.net
